# ChatQuiz konfigurācija
settings:
  # Cik bieži parādās jautājums (minūtēs, nejauši starp min un max)
  min-interval-minutes: 5
  max-interval-minutes: 10
  # 1. mājiens parādās pēc šīm sekundēm pēc jautājuma
  hint-delay-seconds: 10
  # 2. mājiens parādās pēc šīm sekundēm pēc 1. mājiena
  second-hint-delay-seconds: 20
  # Cik sekundes pēc 2. mājiena gaidīt, tad jautājums beidzas un tiek parādīta pareizā atbilde
  end-delay-seconds: 20
  # Minimālais spēlētāju skaits serverī, lai jautājums parādītos
  min-players: 1
  # Paslēpt pareizo atbildi no čata (lai citi to neredz)
  hide-correct-answer: true
  # Balvas daudzums (nejaušs skaits no min līdz max)
  min-amount: 1
  max-amount: 6
  # true = jebkurš nejaušs itēms spēlē; false = tikai saraksts zemāk
  reward-any-item: false

# Balvu saraksts (Minecraft materiālu nosaukumi). Ja vēlies, lai kaut kas krīt biežāk,
# ieraksti to sarakstā vairākas reizes.
reward-materials:
  # vērtīgie resursi un rūdu itēmi (nevis rūdas bloki)
  - DIAMOND
  - EMERALD
  - GOLD_INGOT
  - IRON_INGOT
  - COPPER_INGOT
  - RAW_IRON
  - RAW_GOLD
  - RAW_COPPER
  - COAL
  - LAPIS_LAZULI
  - REDSTONE
  - QUARTZ
  - AMETHYST_SHARD
  - IRON_NUGGET
  - GOLD_NUGGET
  # bloki
  - GLASS
  - STONE
  - COBBLESTONE
  - STONE_BRICKS
  - OAK_PLANKS
  - SPRUCE_PLANKS
  - BIRCH_PLANKS
  - JUNGLE_PLANKS
  - ACACIA_PLANKS
  - DARK_OAK_PLANKS
  - OAK_LOG
  - SPRUCE_LOG
  - BIRCH_LOG
  # tikai zelta ēdiens
  - GOLDEN_APPLE
  - GOLDEN_CARROT
  - GLISTERING_MELON_SLICE

# Ziņojumi (MiniMessage formāts)
messages:
  prefix: "<gold><bold>[Viktorīna]</bold></gold> "
  question: "<yellow>Jautājums:</yellow> <white><question></white> <gray>(Tev ir <seconds> sekundes!)</gray>"
  question-no-timer: "<yellow>Jautājums:</yellow> <white><question></white> <gray>(Nav laika limita – pirmais pareizais uzvar!)</gray>"
  hint: "<aqua>1. mājiens:</aqua> <white><hint></white>"
  hint2: "<aqua>2. mājiens:</aqua> <white><hint></white>"
  winner: "<green><player></green> atbildēja pareizi un ieguva <aqua><amount>x</aqua> <item>! <gray>Atbilde: <answer></gray>"
  timeout: "<red>Laiks beidzies!</red> Pareizā atbilde: <green><answer></green>"
  reward-received: "<green>Apsveicam! Tu saņēmi <amount>x</green> <item><green>!</green>"
  inventory-full: "<gray>Tavs inventārs bija pilns, daļa mantu nokrita zemē.</gray>"
  no-permission: "<red>Tev nav atļaujas.</red>"
  reloaded: "<green>Konfigurācija pārlādēta (<count> jautājumi).</green>"
  asked: "<green>Jautājums uzdots.</green>"
  skipped: "<yellow>Jautājums izlaists.</yellow>"
  already-active: "<red>Jautājums jau ir aktīvs.</red>"
  no-active: "<red>Šobrīd nav aktīva jautājuma.</red>"
  auto-on: "<green>Automātiskā viktorīna ieslēgta: jauns jautājums ik pēc <minutes> min.</green>"
  auto-off: "<yellow>Fiksētais intervāls izslēgts, atgriezts parastais intervāls no config.</yellow>"
  usage: "<gray>Lietošana: /chatquiz <ask|start|auto [minūtes|off]|skip|reload></gray>"

